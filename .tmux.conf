# Yes, I am not using any plugins. I want to keep it really simple for now...

# Color theme
set -g status-style 'bg=#333333 fg=#aaaaaa'

# Enable mouse
set -g mouse on

# Enable vim keybinds
setw -g mode-keys vi

# Change prefix (default ^B, ^ is CTRL)
set -g prefix ^J

# Window index starts at 1 not 0
set -g base-index 1

# After closing window, rename all indexes
 set -g renumber-windows on

# set -g default terminal "{$TERM}"
set -g set-clipboard on

# Remove escape delay. Helps in Neovim to exit from modes or pop-ups.
set -sg escape-time 0

# Open a new window or a split window in the same directory (not ~)
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# image.nvim
set -gq allow-passthrough on
set -g visual-activity off
